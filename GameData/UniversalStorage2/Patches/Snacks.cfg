//Adds Snacks Air to US2 Oxygen Wedge
+PART[USOxygenWedge]:NEEDS[SnacksFreshAir,UniversalStorage2]
{
		@name = SnacksFreshAirWedge
		@title = Snacks Fresh Air Tank
		@tags = Snacks Air
		@description = Fresh air tank for Snacks
		@MODULE[USFuelSwitch]
		{
			@resourceNames = FreshAir;FreshAir;FreshAir;FreshAir
			@resourceAmounts = 150;300;450;600
			@initialResourceAmounts = 150;300;450;600
		}
}
